name: build

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    name: Build (${{ matrix.pkg_suffix }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkg_suffix: linux-amd64
            build_type: Release
            staticcompile: 'ON'
            toolchain: ""
            zlib_flag: "-DZLIB_LIBRARY=-lz"
          - os: ubuntu-24.04-arm
            pkg_suffix: linux-arm64
            build_type: Release
            staticcompile: 'ON'
            toolchain: ""
            zlib_flag: "-DZLIB_LIBRARY=-lz"
          - os: macos-14
            pkg_suffix: macos-arm64
            build_type: Release
            staticcompile: 'ON'
            toolchain: "-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/zig-macos-static.cmake"
            zlib_flag: ""
          - os: macos-13
            pkg_suffix: macos-x86_64
            build_type: Release
            staticcompile: 'ON'
            toolchain: "-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/zig-macos-static.cmake"
            zlib_flag: ""

    steps:
      - name: Install dependencies for Linux
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -yq git cmake bison flex libboost-all-dev python3 perl \
            build-essential python3-distutils-extra wget zlib1g-dev \
            libboost-program-options-dev libboost-serialization-dev \
            libgmp-dev libmpfr-dev help2man zip

      - name: Install dependencies for macOS
        if: contains(matrix.os, 'macos')
        run: |
          brew update
          brew install cmake boost gmp mpfr wget zig zip

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build directories
        run: |
          rm -rf build install release
          mkdir -p install release

      - name: Build Minisat
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_SHARED_LIBS=OFF \
            -DSTATICCOMPILE=${{ matrix.staticcompile }} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            ${{ matrix.toolchain }} \
            ${{ matrix.zlib_flag }}
          cmake --build build --parallel --config ${{ matrix.build_type }}
          cmake --install build --config ${{ matrix.build_type }}

      - name: Package release assets
        run: |
          pkg_root=${{ github.workspace }}/release/${{ matrix.pkg_suffix }}
          mkdir -p "$pkg_root"
          cp -R "${{ github.workspace }}/install/bin" "$pkg_root/"
          cp -R "${{ github.workspace }}/install/lib" "$pkg_root/"
          cp -R "${{ github.workspace }}/install/include" "$pkg_root/"
          cd release
          zip -r "minisat-${{ matrix.pkg_suffix }}.zip" "${{ matrix.pkg_suffix }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: minisat-${{ matrix.pkg_suffix }}
          path: release/minisat-${{ matrix.pkg_suffix }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: minisat-*
          merge-multiple: true
          path: release-artifacts

      - name: Show downloaded artifacts
        run: ls -R release-artifacts

      - name: Prepare release metadata
        id: release_meta
        run: |
          tag="release-${GITHUB_RUN_NUMBER}"
          name="Minisat Release ${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          files: release-artifacts/minisat-*.zip
          generate_release_notes: true
